# cargo-about configuration: `cargo run --locked -p xtask -- notices <dir>
# <target>` writes the third-party notices that every release archive carries,
# the crates' from this file and the template about.hbs.

# The licenses of the crates the binary links, in order of preference: of a
# crate offered under several licenses, the notices carry the first one listed
# here. deny.toml allows the same licenses, and Unlicense besides, which no
# crate needs here because each crate under it also offers MIT.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
# The release targets: a crate only another platform uses is not linked.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
# Build scripts' dependencies and dev-dependencies are not part of the binary.
# Procedural macros are not either, but cargo-about cannot tell them apart, so
# their notices are carried too.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# xtask is never published nor shipped.
private = { ignore = true }

# A clarification replaces what cargo-about would harvest from a crate, so it
# names every file that carries a notice of the crate: its license files and,
# for each distinct copyright notice in its sources, the header of one file
# that carries it, from the copyright line to the end of the license statement.
# Each checksum is the SHA-256 of the text between `start` and `end`, or of the
# whole file. `xtask notices` fails when a checksum no longer matches, and when
# a copyright line in any source file of a clarified crate is missing from the
# notices, so a new release of the crate needs its clarification redone.
#
# ring is "Apache-2.0 AND ISC": its own code under the ISC terms of
# LICENSE-other-bits and of its files' headers, code from BoringSSL and
# OpenSSL under Apache-2.0 (LICENSE-BoringSSL) or under ISC terms, fiat-crypto
# under Apache-2.0, and once_cell's polyfill under Apache-2.0. cargo-about's
# built-in workaround for ring checks files of older releases.
#
# rustls-webpki is ISC, with copyright notices of further authors in some of
# its files' headers.
[ring]
clarify.license = "Apache-2.0 AND ISC"

