# cargo-about configuration: `cargo run --locked -p xtask -- notices <file>`
# writes the third-party notices that every release archive carries, from this
# file and the template about.hbs.

# The licenses of the crates the binary links, in order of preference: of a
# crate offered under several licenses, the notices carry the first one listed
# here. deny.toml allows the same licenses, and Unlicense besides, which no
# crate needs here because each crate under it also offers MIT.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
# The release targets: a crate only another platform uses is not linked.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
# Build scripts' dependencies and dev-dependencies are not part of the binary.
# Procedural macros are not either, but cargo-about cannot tell them apart, so
# their notices are carried too.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# xtask is never published nor shipped.
private = { ignore = true }

# ring is "Apache-2.0 AND ISC", with its terms spread over several files: its
# own code under the ISC terms of LICENSE-other-bits, code from BoringSSL under
# Apache-2.0 (LICENSE-BoringSSL) or under ISC terms with the copyright notice
# at the top of each file, fiat-crypto's code under Apache-2.0, and once_cell's
# polyfill under Apache-2.0. cargo-about's built-in workaround for ring checks
# files of older releases, so the files are named here. Each checksum is the
# SHA-256 of the text between `start` and `end`, or of the whole file; when
# ring changes one, the notices refuse to build until the files are checked
# again.
[ring]
clarify.license = "Apache-2.0 AND ISC"

