# release-plz configuration; the release-plz jobs of .gitlab-ci.yml run it on
# every push to the default branch.

[workspace]
# Only a commit that asks for a release opens or updates the release merge
# request: a feature, fix, performance change or revert (git's own `Revert "`
# subject included), or a breaking change of any type (`!` after the type or a
# BREAKING CHANGE footer). The regex is matched against each commit's whole
# message.
release_commits = '(?m)\A(feat|fix|perf|revert)(\([^)]*\))?!?:|\ARevert "|\A[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE:'
# The crate is not on crates.io yet: the release tags tell the released
# versions, and nothing is published to a registry. `release-plz release`
# tags vX.Y.Z when Cargo.toml holds a version X.Y.Z that has no tag, which the
# merge of the release merge request brings.
git_only = true
# The tag's pipeline creates the GitLab Release, once every archive, its
# checksum and its signature are uploaded.
git_release_enable = false
# A binary has no library API for cargo-semver-checks to compare.
semver_check = false

[[package]]
name = "git-intake"
git_tag_name = "v{{ version }}"
changelog_path = "CHANGELOG.md"

[[package]]
name = "xtask"
release = false
