# release-plz configuration; .github/workflows/release.yml runs it.

[workspace]
# Only a commit that asks for a release opens or updates the release pull
# request: a feature, fix, performance change or revert (git's own `Revert "`
# subject included), or a breaking change of any type (`!` after the type or a
# BREAKING CHANGE footer). The regex is matched against each commit's whole
# message.
release_commits = '(?m)\A(feat|fix|perf|revert)(\([^)]*\))?!?:|\ARevert "|\A[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE:'
# Release only from the merge commit of a release pull request, so that a
# release holds exactly the commits its changelog lists.
release_always = false
# release-plz publishes the crate and creates the tag; binaries.yml, which the
# tag starts, creates the GitHub Release with the changelog entry and publishes
# it once every archive, its checksum and its attestation are in place.
git_release_enable = false
# A binary has no library API for cargo-semver-checks to compare.
semver_check = false

[[package]]
name = "git-intake"
git_tag_name = "v{{ version }}"
changelog_path = "CHANGELOG.md"

[[package]]
name = "xtask"
release = false
