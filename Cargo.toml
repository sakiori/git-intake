[package]
name = "git-intake"
version = "0.5.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Merge-based, verified, resumable updates of a downstream repository from its upstreams, and its releases"
readme = "README.md"
keywords = ["git", "upstream", "fork", "merge", "monorepo"]
categories = ["command-line-utilities", "development-tools"]
# The published crate holds what building and installing the binary needs.
include = ["/src/", "/Cargo.lock", "/LICENSE", "/README.md"]

# cargo-binstall downloads the release archive of the target instead of
# building the crate: git-intake-vX.Y.Z-<target>.tar.gz with the binary at its
# root (see .gitlab/scripts/build-archive.sh), through the permanent URL of
# the GitLab Release's link to it.
[package.metadata.binstall]
pkg-url = "{ repo }/-/releases/v{ version }/downloads/binaries/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

# `xtask` holds development tasks, such as generating the manual page, so that
# their dependencies stay out of the shipped binary.
[workspace]
members = ["xtask"]

# rust-version is the oldest toolchain that builds the workspace with the
# locked dependencies; CI builds it with that toolchain.
[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://gitlab.com/sakiori-oss/git-intake"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
glob = "0.3.4"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
libc = "0.2.190"
percent-encoding = "2.3.2"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = { version = "0.4.6", default-features = false }
toml = "1.1.6"
unicase = "2.10.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
url = "2.5.8"

[dev-dependencies]
assert_cmd = "2.2.2"
mockito = "1.7.2"
predicates = "3.1.4"
tempfile = "3.27.0"

# Release binaries are shipped as small, self-contained downloads:
# - lto and a single codegen unit let the optimiser see the whole program,
#   which removes unused code across crates and shrinks the binary;
# - strip drops symbols and debug information nobody uses at run time;
# - panic = "abort" removes the unwinding machinery; the tool reports errors
#   through its exit status, and a panic is a bug that ends the process anyway.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
