[package]
name = "fork-sync"
version = "0.1.0"
edition = "2024"
description = "Merge-based, verified, resumable updates of a downstream repository from its upstreams"
readme = "README.md"
publish = false

[[bin]]
name = "git-fork-sync"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
