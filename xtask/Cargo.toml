[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Development tasks of git-intake that stay out of the shipped binary"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_mangen = "0.3.3"
flate2 = "1.1.10"
serde_json = "1.0.151"
toml = "1.1.6"
