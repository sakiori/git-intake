# Releases are managed by release-plz. Every push to main updates the release
# pull request, which raises the version in Cargo.toml and Cargo.lock and adds
# the release's entry to CHANGELOG.md, computed from the Conventional Commits
# since the last release. Merging that pull request releases: release-plz
# publishes the crate to crates.io through Trusted Publishing, pushes the tag
# vX.Y.Z and creates a draft GitHub Release with the changelog entry. The build
# jobs then pack an archive git-intake-vX.Y.Z-<target>.tar.gz per target, with
# the binary at its root and the manual pages under man/man1/, and a .sha256
# next to each; the attach job attests every archive's build provenance and
# attaches the files to the release, and the last job publishes it.
#
# A run started by hand (workflow_dispatch) for an existing tag vX.Y.Z whose
# version is on crates.io builds, attests and attaches the binaries and
# publishes the release, creating the draft release if it is missing; it
# never publishes the crate. It finishes the first release from GitHub, whose
# crate and tag are published by hand, and a release whose build failed. A
# release that is already published is left alone.
#
# Pinned versions bumped by hand (Dependabot updates only the actions):
# - release-plz 0.3.174 (the release-plz action's `version` input)
# - zig 0.17.0 (setup-zig's `version` input)
# - cargo-zigbuild 0.23.4 (install-action's `tool` input)
# The Rust toolchain is the current stable release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag vX.Y.Z to build and publish binaries for
        required: true
        type: string

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  release-pr:
    if: github.event_name == 'push' && github.repository_owner == 'sakiori'
    runs-on: ubuntu-latest
    # The environment holds the GitHub App's client id (variable
    # RELEASE_APP_CLIENT_ID) and private key (secret RELEASE_APP_PRIVATE_KEY),
    # so that only this job can mint the App's token.
    environment: release-pr
    permissions:
      contents: read
    # Only the latest main matters for the release pull request.
    concurrency:
      group: release-pr
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # The committed version is the placeholder 0.0.0 until the cutover to
      # GitHub releases; a release pull request from it would propose a
      # version no release had.
      - name: Refuse the placeholder version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "git-intake") | .version')
          if [ "$version" = 0.0.0 ]; then
            echo "::error::Cargo.toml holds the placeholder version 0.0.0. At the cutover, set it to the next unreleased version, publish that version to crates.io and push its tag vX.Y.Z by hand, then run this workflow by hand for that tag."
            exit 1
          fi
      # Pull requests opened with the workflow's own token start no workflow
      # runs, so the release pull request is opened with a GitHub App's token,
      # whose pull requests run CI.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: release-plz/action@8b5bf233ecb5779f63508db7cd050e948ee77cc2 # v0.5.144
        with:
          command: release-pr
          version: 0.3.174
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release:
    if: github.event_name == 'push' && github.repository_owner == 'sakiori'
    runs-on: ubuntu-latest
    # crates.io's Trusted Publishing configuration names this environment, so
    # only this job can obtain a publish token.
    environment: release
    permissions:
      contents: write # push the tag and create the draft release
      pull-requests: read # tell a release pull request's merge commit
      id-token: write # Trusted Publishing to crates.io
    # One group per commit, so that no run waits behind another commit's run
    # and is superseded and lost. Runs of different commits cannot publish
    # twice: only the merge commit of a release pull request releases
    # (release_always = false in release-plz.toml), and release-plz skips a
    # version whose tag or crates.io release exists. A re-run of the same
    # commit queues behind it in its group.
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Refuse the placeholder version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "git-intake") | .version')
          if [ "$version" = 0.0.0 ]; then
            echo "::error::Cargo.toml holds the placeholder version 0.0.0. At the cutover, set it to the next unreleased version, publish that version to crates.io and push its tag vX.Y.Z by hand, then run this workflow by hand for that tag."
            exit 1
          fi
      # Without CARGO_REGISTRY_TOKEN, release-plz obtains a short-lived token
      # through crates.io's Trusted Publishing with the job's OIDC token.
      - id: release-plz
        uses: release-plz/action@8b5bf233ecb5779f63508db7cd050e948ee77cc2 # v0.5.144
        with:
          command: release
          version: 0.3.174
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: tag
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag=$(printf '%s' "${RELEASES:-[]}" | jq -r '.[] | select(.package_name == "git-intake") | .tag')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # The run started by hand: checks the tag and that its version is on
  # crates.io, and hands the tag on unless its release is published already.
  dispatch:
    if: github.event_name == 'workflow_dispatch' && github.repository_owner == 'sakiori'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: release-dispatch-${{ github.event.inputs.tag }}
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - id: input
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # The whole value, newlines included, must be one tag.
          if ! [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the tag input is not a release tag vX.Y.Z"
            exit 1
          fi
          echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.input.outputs.tag }}
          persist-credentials: false
      - id: release
        env:
          TAG: ${{ steps.input.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${TAG#v}
          committed=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "$committed" != "$version" ]; then
            echo "::error::Cargo.toml at $TAG holds version $committed, not $version"
            exit 1
          fi
          published=$(curl --fail --silent --show-error --location \
            --user-agent "git-intake release workflow (https://github.com/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/git-intake/$version" | jq -r '.version.num' || true)
          if [ "$published" != "$version" ]; then
            echo "::error::git-intake $version is not on crates.io; publish it before its binaries"
            exit 1
          fi
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null) \
            && [ "$draft" = false ]; then
            echo "::notice::the release $TAG is published already; nothing to do"
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

  # Compiles and packs; it holds no write permission.
  build:
    name: build (${{ matrix.target }})
    needs: [release, dispatch]
    if: ${{ !cancelled() && !failure() && (needs.release.outputs.tag || needs.dispatch.outputs.tag) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static Linux binaries, cross-compiled with cargo-zigbuild as the
          # GitLab release builds were.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            build-tool: cargo-zigbuild
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            build-tool: cargo-zigbuild
          # A macOS binary links the system's Security framework, so it is
          # built on macOS.
          - target: aarch64-apple-darwin
            os: macos-latest
            build-tool: cargo
          - target: x86_64-apple-darwin
            os: macos-latest
            build-tool: cargo
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ needs.release.outputs.tag || needs.dispatch.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.tag || needs.dispatch.outputs.tag }}
          persist-credentials: false
      - run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
      - if: matrix.build-tool == 'cargo-zigbuild'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      - if: matrix.build-tool == 'cargo-zigbuild'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-zigbuild@0.23.4
      # The manual pages of the release, generated on the build host.
      - run: cargo run --locked --quiet -p xtask -- man man/man1
      # Builds the binary and packs it with man/ at the archive root, without
      # uploading anything.
      - id: archive
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: git-intake
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool }}
          archive: $bin-$tag-$target
          include: man
          locked: true
          ref: refs/tags/${{ needs.release.outputs.tag || needs.dispatch.outputs.tag }}
          dry-run: true
          dry-run-intended: true
      - env:
          ARCHIVE: ${{ steps.archive.outputs.tar }}
        run: |
          [ -f "$ARCHIVE" ] || { echo "no archive $ARCHIVE" >&2; exit 1; }
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          cat "$ARCHIVE.sha256"
          tar -tzf "$ARCHIVE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: |
            ${{ steps.archive.outputs.tar }}
            ${{ steps.archive.outputs.tar }}.sha256
          if-no-files-found: error
          retention-days: 30

  # Checks every archive against its checksum, attests its build provenance
  # and attaches both files to the draft release, which it creates when it is
  # missing, with the release's CHANGELOG.md section as its notes.
  attach:
    needs: [release, dispatch, build]
    if: ${{ !cancelled() && !failure() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and upload its files
      id-token: write # sign the attestations
      attestations: write # store the attestations
      artifact-metadata: write # record the attested archives
    env:
      TAG: ${{ needs.release.outputs.tag || needs.dispatch.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.tag || needs.dispatch.outputs.tag }}
          path: source
          persist-credentials: false
      - run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            exit 0
          fi
          version=${TAG#v}
          notes="$RUNNER_TEMP/notes.md"
          if [ -f source/CHANGELOG.md ]; then
            awk -v v="$version" '
              /^## / { if (found) exit; if (index($0, "[" v "]") || $2 == v) { found = 1; next } }
              found { print }
            ' source/CHANGELOG.md > "$notes"
          fi
          if ! grep -q '[^[:space:]]' "$notes" 2>/dev/null; then
            echo "Release $TAG of git-intake." > "$notes"
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$TAG" --notes-file "$notes"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - working-directory: dist
        run: |
          ls -l
          sha256sum --check -- *.sha256
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - run: gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --repo "$GITHUB_REPOSITORY" --clobber

  # The release stays a draft until every archive and its checksum are
  # attached, so that it is never seen incomplete.
  publish:
    needs: [release, dispatch, attach]
    if: ${{ !cancelled() && !failure() && needs.attach.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the draft release
    env:
      TAG: ${{ needs.release.outputs.tag || needs.dispatch.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # A release run by hand for an older tag is not marked as the latest.
      - run: |
          newest=$( { gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 \
            --json tagName --jq '.[].tagName'; echo "$TAG"; } | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1)
          if [ "$newest" = "$TAG" ]; then latest=true; else latest=false; fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
