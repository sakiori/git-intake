# Releases are managed by release-plz. Every push to main updates the release
# pull request, which raises the version in Cargo.toml and Cargo.lock and adds
# the release's entry to CHANGELOG.md, computed from the Conventional Commits
# since the last release. Merging that pull request releases: once the release
# builds that CI ran on the pull request's last commit have passed, release-plz
# publishes the crate to crates.io through Trusted Publishing and creates the
# tag vX.Y.Z on that commit. The tag is created with a GitHub App's token, so
# it starts binaries.yml, which builds, attests and attaches the binaries and
# publishes the GitHub Release. RELEASING.md describes the setup and recovery.
#
# Pinned versions bumped by hand (Dependabot updates only the actions):
# - release-plz 0.3.174 (the release-plz action's `version` input)
# The Rust toolchain is the current stable release.
name: Release

on:
  push:
    branches: [main]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  release-pr:
    if: github.repository_owner == 'sakiori'
    runs-on: ubuntu-latest
    # The environment holds the GitHub App's client id (variable
    # RELEASE_APP_CLIENT_ID) and private key (secret RELEASE_APP_PRIVATE_KEY),
    # and admits only main.
    environment: release-pr
    permissions:
      contents: read
    # Only the latest main matters for the release pull request: a newer push
    # replaces a run that still waits, but a run in progress is never
    # interrupted, so release-plz never stops halfway through updating it.
    concurrency:
      group: release-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # The committed version is the placeholder 0.0.0 until the cutover to
      # GitHub releases; a release pull request from it would propose a
      # version no release had.
      - name: Refuse the placeholder version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "git-intake") | .version')
          if [ "$version" = 0.0.0 ]; then
            echo "::error::Cargo.toml holds the placeholder version 0.0.0; RELEASING.md describes the cutover."
            exit 1
          fi
      # Pull requests opened with the workflow's own token start no workflow
      # runs, so the release pull request is opened with a GitHub App's token,
      # whose pull requests run CI.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: release-plz/action@8b5bf233ecb5779f63508db7cd050e948ee77cc2 # v0.5.144
        with:
          command: release-pr
          version: 0.3.174
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release:
    if: github.repository_owner == 'sakiori'
    runs-on: ubuntu-latest
    # crates.io's Trusted Publishing configuration names this environment, so
    # only this job can obtain a publish token. The environment also holds the
    # GitHub App's client id (variable RELEASE_APP_CLIENT_ID) and private key
    # (secret RELEASE_APP_PRIVATE_KEY), and admits only main.
    environment: release
    permissions:
      contents: read
      pull-requests: read # find the release pull request of the commit
      checks: read # read the release builds of its last commit
      id-token: write # Trusted Publishing to crates.io
    # One group per commit, so that no run waits behind another commit's run
    # and is superseded and lost. Runs of different commits cannot publish
    # twice: only the merge of a release pull request releases
    # (release_always = false in release-plz.toml), and release-plz skips a
    # version whose tag or crates.io release exists. A re-run of the same
    # commit queues behind it in its group.
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Refuse the placeholder version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "git-intake") | .version')
          if [ "$version" = 0.0.0 ]; then
            echo "::error::Cargo.toml holds the placeholder version 0.0.0; RELEASING.md describes the cutover."
            exit 1
          fi
      # The crate is published before any binary is built, and a published
      # version cannot be replaced. release-plz releases the last commit of the
      # merged release pull request, so CI's release builds of every target
      # must have passed on that commit. A commit that is not the merge of a
      # release pull request releases nothing and needs no check.
      - name: Require the release builds of the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and (.head.ref | startswith("release-plz-")))] | first | .head.sha // empty')
          if [ -z "$head" ]; then
            echo "::notice::$GITHUB_SHA is not the merge of a release pull request"
            exit 0
          fi
          runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?per_page=100" --jq '.check_runs[]' | jq -s .)
          failed=0
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-apple-darwin; do
            check="release-build ($target)"
            conclusion=$(printf '%s' "$runs" | jq -r --arg name "$check" \
              '[.[] | select(.name == $name and .app.slug == "github-actions")] | sort_by(.completed_at // "") | last | .conclusion // "missing"')
            echo "$check on $head: $conclusion"
            [ "$conclusion" = success ] || failed=1
          done
          if [ "$failed" != 0 ]; then
            echo "::error::the release builds did not all pass on $head, the release pull request's last commit; nothing was published"
            exit 1
          fi
      # Tags created with the workflow's own token start no workflow, so
      # release-plz creates the tag with the GitHub App's token, whose tag
      # starts binaries.yml.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      # Without CARGO_REGISTRY_TOKEN, release-plz obtains a short-lived token
      # through crates.io's Trusted Publishing with the job's OIDC token. It
      # creates the tag through GitHub's API with GITHUB_TOKEN.
      - uses: release-plz/action@8b5bf233ecb5779f63508db7cd050e948ee77cc2 # v0.5.144
        with:
          command: release
          version: 0.3.174
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
