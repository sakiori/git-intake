# Builds, attests and attaches the binaries of a release tag vX.Y.Z, and
# publishes its GitHub Release. The tag release.yml creates starts it; to
# finish a release whose run failed, run it by hand on the tag:
#
#   gh workflow run binaries.yml --ref vX.Y.Z
#
# Either way the run's commit (github.sha) is the tag's commit, which is the
# commit the binaries are built from and the one their provenance names. The
# run refuses any other ref, a tag that has moved, a commit not on main, and a
# version that is not on crates.io. Each archive git-intake-vX.Y.Z-<target>.tar.gz
# holds the binary, LICENSE, THIRD-PARTY-NOTICES.txt and the manual pages under
# man/man1/ (see .github/scripts/build-archive.sh), with a .sha256 next to it.
# The release stays a draft until every archive, its checksum and its
# attestation are in place; a release that is already published is left
# alone. RELEASING.md describes the setup and recovery.
#
# Pinned versions bumped by hand (Dependabot updates only the actions):
# - zig 0.17.0 (setup-zig's `version` input)
# - cargo-zigbuild 0.23.4 and cargo-about 0.9.2 (install-action's `tool` input)
# The Rust toolchain is the current stable release.
name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

# Every run of one tag, pushed or started by hand, runs in turn and in full:
# none is cancelled, and none starts while another builds, attaches or
# publishes the same release.
concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  CARGO_TERM_COLOR: always

jobs:
  # Checks the tag and that its version is on crates.io, and tells whether the
  # release is published already.
  check:
    if: github.repository_owner == 'sakiori'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      published: ${{ steps.state.outputs.published }}
    steps:
      - id: tag
        run: |
          if ! [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_REF is not a release tag vX.Y.Z; run this workflow with --ref vX.Y.Z"
            exit 1
          fi
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # The tag as the checkout just fetched it, peeled to its commit.
          tagged=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" || true)
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG points at ${tagged:-nothing}, not at this run's commit $GITHUB_SHA"
            exit 1
          fi
          # Only a commit on main is released: it went through review and CI.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the commit of $TAG is not on main"
            exit 1
          fi
          version=${TAG#v}
          committed=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "$committed" != "$version" ]; then
            echo "::error::Cargo.toml at $TAG holds version $committed, not $version"
            exit 1
          fi
          published=$(curl --fail --silent --show-error --location \
            --user-agent "git-intake release workflow (https://github.com/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/git-intake/$version" | jq -r '.version.num' || true)
          if [ "$published" != "$version" ]; then
            echo "::error::git-intake $version is not on crates.io; publish it before its binaries"
            exit 1
          fi
      # A first look, so that a published release builds nothing; the finish
      # job looks again before it changes anything.
      - id: state
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null) \
            && [ "$draft" = false ]; then
            echo "::notice::the release $TAG is published already; nothing to do"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  # Compiles and packs; it holds no write permission.
  build:
    name: build (${{ matrix.target }})
    needs: check
    if: needs.check.outputs.published == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static Linux binaries, cross-compiled with cargo-zigbuild.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            build-tool: cargo-zigbuild
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            build-tool: cargo-zigbuild
          # A macOS binary links the system's Security framework, so it is
          # built on macOS.
          - target: aarch64-apple-darwin
            os: macos-latest
            build-tool: cargo
          - target: x86_64-apple-darwin
            os: macos-latest
            build-tool: cargo
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      BUILD_TOOL: ${{ matrix.build-tool }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
      - if: matrix.build-tool == 'cargo-zigbuild'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      - if: matrix.build-tool == 'cargo-zigbuild'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-zigbuild@0.23.4
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2
      - run: .github/scripts/build-archive.sh "$TARGET" "$BUILD_TOOL"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  # Attests every archive's build provenance, checks that the attestation
  # names this repository, this workflow, the tag and its commit, attaches the
  # archives and their checksums to the draft release, which it creates when
  # it is missing, and publishes the release.
  finish:
    needs: [check, build]
    runs-on: ubuntu-latest
    # The environment admits only tags vX.Y.Z.
    environment: release-binaries
    permissions:
      contents: write # create, upload to and publish the release
      id-token: write # sign the attestations
      attestations: write # store the attestations
      artifact-metadata: write # record the attested archives
    # One release is finished at a time, whatever its tag, so that whether
    # it is the latest release is decided and set without another release
    # changing in between. Runs wait in turn; none is cancelled.
    concurrency:
      group: release-binaries-finish
      cancel-in-progress: false
      queue: max
    env:
      TAG: ${{ needs.check.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - working-directory: dist
        run: |
          ls -l
          [ "$(find . -name '*.tar.gz' | wc -l)" = 4 ] || { echo "::error::dist holds no archive for every target"; exit 1; }
          sha256sum --check -- *.sha256
      # The publication state again, now that this job is the only one that
      # changes a release: a release published since the check job is left
      # alone, and only a draft's files are ever replaced.
      - id: state
        run: |
          if ! draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            echo "state=missing" >> "$GITHUB_OUTPUT"
          elif [ "$draft" = true ]; then
            echo "state=draft" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::the release $TAG was published meanwhile; nothing to do"
            echo "state=published" >> "$GITHUB_OUTPUT"
          fi
      - id: attest
        if: steps.state.outputs.state != 'published'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - if: steps.state.outputs.state != 'published'
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          for archive in dist/*.tar.gz; do
            gh attestation verify "$archive" --bundle "$BUNDLE" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/binaries.yml" \
              --source-ref "refs/tags/$TAG" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
      - if: steps.state.outputs.state == 'missing'
        run: |
          version=${TAG#v}
          notes="$RUNNER_TEMP/notes.md"
          if [ -f source/CHANGELOG.md ]; then
            awk -v v="$version" '
              /^## / { if (found) exit; if (index($0, "[" v "]") || $2 == v) { found = 1; next } }
              found { print }
            ' source/CHANGELOG.md > "$notes"
          fi
          if ! grep -q '[^[:space:]]' "$notes" 2>/dev/null; then
            echo "Release $TAG of git-intake." > "$notes"
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$TAG" --notes-file "$notes"
      # The release is a draft, which nobody but the repository's writers
      # sees, so replacing a file an earlier run attached is safe.
      - if: steps.state.outputs.state != 'published'
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --repo "$GITHUB_REPOSITORY" --clobber
      # A release of an older tag is not marked as the latest.
      - if: steps.state.outputs.state != 'published'
        run: |
          newest=$( { gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 \
            --json tagName --jq '.[].tagName'; echo "$TAG"; } | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1)
          if [ "$newest" = "$TAG" ]; then latest=true; else latest=false; fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
