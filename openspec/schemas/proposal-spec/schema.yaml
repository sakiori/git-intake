name: proposal-spec
version: 1
description: Substantial changes described by a proposal and behavior deltas, with optional design notes.
artifacts:
  - id: proposal
    generates: proposal.md
    description: Purpose, scope, affected capabilities, and affected capabilities.
    template: proposal.md
    instruction: |
      State the problem, intended outcome, constraints, and affected capabilities.
      Link a tracker item when one exists. Discuss unresolved consequential choices with the owner.
      Keep technical tradeoffs in design.md when they need a separate explanation.
    requires: []
  - id: specs
    generates: "specs/**/*.md"
    description: Observable requirements and scenarios for affected capabilities.
    template: spec.md
    instruction: |
      Write behavior deltas under the existing capability paths using OpenSpec requirement
      and scenario headings. State observable behavior and constraints, with verifiable
      scenarios. Preserve full requirement text when modifying a requirement.
      Use skip_specs only for an existing change that does not change specified behavior.
    requires: [proposal]
apply:
  requires: [proposal, specs]
  tracks: null
  instruction: |
    Read the proposal, relevant specifications, and design.md when present.
    Implement the agreed outcome, adapting the execution plan to current evidence.
    Keep requirements and consequential decisions accurate as understanding changes.
    Verify the complete result against its requirements and the repository's checks.
